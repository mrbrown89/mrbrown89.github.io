title: "Matt Brown"
description: "Thoughts, projects, and walkthroughs"
url: "https://mrbrown89.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.24.0"

minimal_mistakes_skin: "dark"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

author:
  name: "Matt Brown"
  bio: "macOS, Linux, GitOps, infrastructure systems."
  avatar: "/assets/images/profile.png"
  links:
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/matt-brown-2a77b3283"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: false
      share: true

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
